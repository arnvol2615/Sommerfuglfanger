name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME }}
      KEYVAULT_SECRET_NAME: ${{ vars.AZURE_KEYVAULT_SECRET_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        if: env.KEYVAULT_NAME != '' && env.KEYVAULT_SECRET_NAME != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch iNaturalist Token From Key Vault
        if: env.KEYVAULT_NAME != '' && env.KEYVAULT_SECRET_NAME != ''
        uses: azure/cli@v2
        with:
          inlineScript: |
            TOKEN=$(az keyvault secret show --vault-name "$KEYVAULT_NAME" --name "$KEYVAULT_SECRET_NAME" --query value -o tsv)
            if [ -z "$TOKEN" ]; then
              echo "Key Vault secret is empty: $KEYVAULT_SECRET_NAME" >&2
              exit 1
            fi
            echo "::add-mask::$TOKEN"
            echo "INAT_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Validate Key Vault Setup
        if: env.KEYVAULT_NAME != '' && env.KEYVAULT_SECRET_NAME != ''
        run: |
          if [ -z "$INAT_API_TOKEN" ]; then
            echo "INAT_API_TOKEN is not available after Key Vault fetch" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
